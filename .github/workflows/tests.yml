name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: 11, testbench: '9.*' }
          - { php: '8.3', laravel: 11, testbench: '9.*' }
          - { php: '8.3', laravel: 12, testbench: '10.*' }
          - { php: '8.4', laravel: 12, testbench: '10.*' }
          - { php: '8.4', laravel: 13, testbench: '11.*' }

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ matrix.testbench }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: >
          composer update
          --with="orchestra/testbench:${{ matrix.testbench }}"
          --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
